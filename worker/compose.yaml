services:
  api:
    build:
      context: ./api
    restart: unless-stopped
    gpus: all
    env_file:
      - ../.env
    ports:
      - "127.0.0.1:8765:8765"
    volumes:
      - voice_data:/data
    healthcheck:
      test: ["CMD", "python", "-m", "app.healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 4

  seed:
    build:
      context: ./seed
      args:
        PYTORCH_BASE_IMAGE: ${PYTORCH_BASE_IMAGE:-pytorch/pytorch:2.4.0-cuda12.1-cudnn9-runtime@sha256:68c022c2f4627943a6f3e574cfd2c8ae4256210d5f66ae2b117942e0a8d4fa9d}
        TORCH_VERSION: ${TORCH_VERSION:-2.4.0}
        TORCH_INDEX_URL: ${TORCH_INDEX_URL:-https://download.pytorch.org/whl/cu121}
    restart: unless-stopped
    gpus: all
    env_file:
      - ../.env
    ports:
      # Loopback only: the control plane reaches the engine over the compose
      # network, and this mapping exists for health checks and debugging.
      - "127.0.0.1:8790:8790"
    volumes:
      - voice_data:/data
      - seed_checkpoints:/opt/seed-vc/checkpoints

  realtime:
    build:
      context: ./realtime
      args:
        PYTORCH_BASE_IMAGE: ${PYTORCH_BASE_IMAGE:-pytorch/pytorch:2.4.0-cuda12.1-cudnn9-runtime@sha256:68c022c2f4627943a6f3e574cfd2c8ae4256210d5f66ae2b117942e0a8d4fa9d}
        TORCH_VERSION: ${TORCH_VERSION:-2.4.0}
        TORCH_INDEX_URL: ${TORCH_INDEX_URL:-https://download.pytorch.org/whl/cu121}
    restart: unless-stopped
    # Host networking is required: aiortc gathers its own UDP ports for media,
    # which cannot be published from a bridge network. Signalling still binds to
    # 127.0.0.1 only, so it is reachable just through the desktop's SSH tunnel.
    network_mode: host
    gpus: all
    env_file:
      - ../.env
    volumes:
      - voice_data:/data
      - realtime_checkpoints:/opt/seed-vc-realtime/checkpoints

  rvc:
    build:
      context: ./rvc
      args:
        TORCH_VERSION: ${RVC_TORCH_VERSION:-2.7.1}
        TORCH_INDEX_URL: ${RVC_TORCH_INDEX_URL:-https://download.pytorch.org/whl/cu118}
        RVC_CUDA_VARIANT: ${RVC_CUDA_VARIANT:-cu118}
    restart: unless-stopped
    gpus: all
    # RVC's trainer runs four dataloader workers with a prefetch of eight and
    # explicitly warns that they need shared memory. Docker's 64 MB default is
    # not enough and the workers die mid-epoch.
    shm_size: "8gb"
    env_file:
      - ../.env
    volumes:
      - voice_data:/data
      - rvc_assets:/opt/rvc/assets
      - rvc_logs:/opt/rvc/logs
      - rvc_cache:/opt/rvc/.hf

  tts:
    build:
      context: ./tts
    restart: unless-stopped
    env_file:
      - ../.env
    volumes:
      - voice_data:/data
      - tts_models:/opt/tts/models
      - tts_cache:/root/.cache/huggingface

volumes:
  voice_data:
  seed_checkpoints:
  realtime_checkpoints:
  rvc_assets:
  rvc_logs:
  rvc_cache:
  tts_models:
  tts_cache:
